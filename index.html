<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Course Builder</title>

<style>
body {
  font-family: system-ui;
  background: #f1f5f9;
  padding: 20px;
}

.container {
  background: white;
  padding: 20px;
  border-radius: 12px;
  max-width: 900px;
  margin: auto;
}

.section {
  position: relative;
  border: 2px solid #cbd5f5;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}

.lesson {
  position: relative;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 16px;
  margin-top: 12px;
}

.remove-btn {
  position: absolute;
  top: 12px;
  right: 12px;
}

.form-group {
  max-width: 600px;
}

label {
  font-weight: 600;
  display: block;
  margin-top: 10px;
}

input, select {
  width: 100%;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #cbd5e1;
}

.skills {
  display: flex;
  gap: 10px;
  margin-top: 6px;
}

button {
  margin-top: 10px;
  margin-right: 10px;
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
}

.primary { background: #2563eb; color: white; }
.danger { background: #ef4444; color: white; }
.copy { background: #f59e0b; color: white; }
.reset { background: #6b7280; color: white; }

pre {
  margin-top: 20px;
  background: #020617;
  color: #e2e8f0;
  padding: 16px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<h2>Course Builder</h2>

<div id="sections"></div>

<button onclick="addSection()">+ Add Section</button>

<br><br>

<button class="primary" onclick="generate()">Generate JSON</button>
<button class="copy" onclick="copyJSON()">Copy JSON</button>
<button class="reset" onclick="resetAll()">Reset</button>

<pre id="output">// JSON here</pre>

</div>

<script>
let sectionId = 0;

function updateSectionTitles() {
  document.querySelectorAll(".section").forEach((sec, i) => {
    sec.querySelector(".section-title").innerText = `Section ${i + 1}`;
    updateLessonTitles(sec);
    updateSectionDuration(sec);
  });
}

function updateLessonTitles(sectionEl) {
  sectionEl.querySelectorAll(".lesson").forEach((l, i) => {
    l.querySelector(".lesson-title").innerText = `Lesson ${i + 1}`;
  });
}

function updateSectionDuration(sectionEl) {
  let total = 0;

  sectionEl.querySelectorAll(".lesson").forEach(l => {
    const type = l.querySelector(".type").value;

    if (type === "VIDEO") {
      total += Number(l.querySelector(".duration").value || 0);
    }

    if (type === "QUIZ") {
      total += Number(l.querySelector(".quiz-duration").value || 0);
    }
  });

  sectionEl.querySelector(".section-duration").value = total;
}

function onDurationChange(input) {
  const section = input.closest(".section");
  updateSectionDuration(section);
}

function addSection() {
  sectionId++;

  const container = document.getElementById("sections");

  container.insertAdjacentHTML("beforeend", `
  <div class="section" id="section-${sectionId}">

    <button class="danger remove-btn" onclick="removeSection(${sectionId})">
      Remove Section
    </button>

    <h3 class="section-title"></h3>

    <div class="form-group">
      <label>Section Name *</label>
      <input class="section-name">

      <label>Section Duration (seconds)</label>
      <input class="section-duration" type="number" readonly>
    </div>

    <h4>Lessons</h4>
    <div class="lessons"></div>

    <button onclick="addLesson(${sectionId})">+ Add Lesson</button>

  </div>
  `);

  addLesson(sectionId);
  updateSectionTitles();
}

function addLesson(sectionId) {
  const container = document.querySelector(`#section-${sectionId} .lessons`);

  container.insertAdjacentHTML("beforeend", `
  <div class="lesson">

    <button class="danger remove-btn" onclick="removeLesson(this)">
      Remove Lesson
    </button>

    <h4 class="lesson-title"></h4>

    <div class="form-group">
      <label>Type *</label>
      <select class="type" onchange="toggle(this)">
        <option value="">Select</option>
        <option value="VIDEO">VIDEO</option>
        <option value="QUIZ">QUIZ</option>
      </select>

      <label>Name *</label>
      <input class="name">
    </div>

    <div class="video form-group" style="display:none">
      <label>Video URL *</label>
      <input class="video-url">

      <label>Thumbnail URL *</label>
      <input class="thumb">

      <label>Duration (seconds) *</label>
      <input class="duration" type="number" oninput="onDurationChange(this)">

      <label>Skills *</label>
      <div class="skills">
        <label><input type="checkbox" value="speaking" class="skill">Speaking</label>
        <label><input type="checkbox" value="writing" class="skill">Writing</label>
        <label><input type="checkbox" value="listening" class="skill">Listening</label>
        <label><input type="checkbox" value="reading" class="skill">Reading</label>
      </div>
    </div>

    <div class="quiz form-group" style="display:none">
      <label>Question IDs *</label>
      <input class="qids">

      <label>Duration (seconds) *</label>
      <input class="quiz-duration" type="number" oninput="onDurationChange(this)">
    </div>

  </div>
  `);

  updateSectionTitles();
}

function removeLesson(btn) {
  const section = btn.closest(".section");
  const container = section.querySelector(".lessons");

  if (container.children.length <= 1) {
    alert("At least 1 lesson required");
    return;
  }

  btn.closest(".lesson").remove();
  updateSectionTitles();
}

function removeSection(id) {
  if (document.querySelectorAll(".section").length <= 1) {
    alert("At least 1 section required");
    return;
  }

  document.getElementById(`section-${id}`).remove();
  updateSectionTitles();
}

function toggle(select) {
  const lesson = select.closest(".lesson");

  lesson.querySelector(".video").style.display =
    select.value === "VIDEO" ? "block" : "none";

  lesson.querySelector(".quiz").style.display =
    select.value === "QUIZ" ? "block" : "none";

  const section = select.closest(".section");
  updateSectionDuration(section);
}

function generate() {
  const sections = [];

  document.querySelectorAll(".section").forEach(sec => {
    const name = sec.querySelector(".section-name").value;
    const duration = sec.querySelector(".section-duration").value;

    const lessons = [];

    sec.querySelectorAll(".lesson").forEach(l => {
      const type = l.querySelector(".type").value;

      const lesson = {
        name: l.querySelector(".name").value,
        type
      };

      if (type === "VIDEO") {
        lesson.videoUrl = l.querySelector(".video-url").value;
        lesson.thumbnailUrl = l.querySelector(".thumb").value;
        lesson.duration = Number(l.querySelector(".duration").value);
        lesson.skills = Array.from(l.querySelectorAll(".skill:checked")).map(s => s.value);
      }

      if (type === "QUIZ") {
        lesson.questionId = l.querySelector(".qids").value
          .split(",")
          .map(i => i.trim()); 
        lesson.duration = Number(l.querySelector(".quiz-duration").value);
      }

      lessons.push(lesson);
    });

    sections.push({
      name,
      duration: Number(duration),
      lessons
    });
  });

  document.getElementById("output").textContent =
    JSON.stringify(sections, null, 2);
}

function copyJSON() {
  navigator.clipboard.writeText(
    document.getElementById("output").textContent
  );
  alert("Copied!");
}

function resetAll() {
  document.getElementById("sections").innerHTML = "";
  sectionId = 0;
  addSection();
  document.getElementById("output").textContent = "// JSON here";
}

addSection();
</script>

</body>
</html>
