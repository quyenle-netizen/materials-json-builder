<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Lesson JSON Generator</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      padding: 24px;
      background: #f5f5f5;
      margin: 0;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
    }

    .lesson {
      border: 1px solid #ddd;
      padding: 16px;
      margin-bottom: 16px;
      border-radius: 10px;
      background: #fafafa;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .full-width { grid-column: 1 / -1; }

    label {
      font-size: 13px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .skills-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary { background: #111827; color: white; }
    .danger { background: #ef4444; color: white; }
    .secondary { background: #e5e7eb; }

    pre {
      background: #111827;
      color: #00ff99;
      padding: 16px;
      border-radius: 10px;
      margin-top: 20px;
    }

    .error {
      border: 2px solid red !important;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Course Builder</h2>

  <!-- SECTION -->
  <div class="grid">

    <div>
      <label>Section Name *</label>
      <input id="sectionName" />
    </div>

    <div>
      <label>Section Duration (minutes) *</label>
      <input id="sectionDuration" type="number" min="1" />
    </div>

  </div>

  <hr />

  <h3>Lessons</h3>

  <button class="secondary" onclick="addLesson()">+ Add Lesson</button>

  <div id="lessonsContainer"></div>

  <button class="primary" onclick="generateJSON()">Generate JSON</button>

  <pre id="output"></pre>

</div>

<script>
let lessonIndex = 0;

function addLesson() {
  lessonIndex++;

  const lessonHTML = `
    <div class="lesson" id="lesson-${lessonIndex}">

      <div style="display:flex;justify-content:space-between;">
        <h3>Lesson ${lessonIndex}</h3>
        <button class="danger" onclick="removeLesson(${lessonIndex})">Remove</button>
      </div>

      <div class="grid">

        <div>
          <label>Type *</label>
          <select class="lesson-type" onchange="toggleLessonFields(${lessonIndex})">
            <option value="">Select</option>
            <option value="VIDEO">VIDEO</option>
            <option value="QUIZ">QUIZ</option>
          </select>
        </div>

        <div>
          <label>Lesson Name *</label>
          <input class="lesson-name" />
        </div>

      </div>

      <!-- VIDEO -->
      <div id="video-fields-${lessonIndex}" style="display:none;">
        <div class="grid">

          <div class="full-width">
            <label>Video URL *</label>
            <input class="lesson-video-url" />
          </div>

          <div>
            <label>Duration *</label>
            <input class="lesson-duration" type="number" />
          </div>

          <div class="full-width">
            <label>Skills *</label>

            <div class="skills-wrapper">
              <label><input type="checkbox" class="lesson-skill" value="speaking"/> Speaking</label>
              <label><input type="checkbox" class="lesson-skill" value="writing"/> Writing</label>
              <label><input type="checkbox" class="lesson-skill" value="listening"/> Listening</label>
              <label><input type="checkbox" class="lesson-skill" value="reading"/> Reading</label>
            </div>
          </div>

          <div class="full-width">
            <label>Resources (optional)</label>
            <textarea class="lesson-resources"></textarea>
          </div>

        </div>
      </div>

      <!-- QUIZ -->
      <div id="quiz-fields-${lessonIndex}" style="display:none;">
        <label>Question IDs *</label>
        <input class="lesson-question-ids" />
      </div>

    </div>
  `;

  document.getElementById("lessonsContainer")
    .insertAdjacentHTML("beforeend", lessonHTML);
}

function toggleLessonFields(index) {
  const lesson = document.getElementById(`lesson-${index}`);
  const type = lesson.querySelector(".lesson-type").value;

  document.getElementById(`video-fields-${index}`).style.display =
    type === "VIDEO" ? "block" : "none";

  document.getElementById(`quiz-fields-${index}`).style.display =
    type === "QUIZ" ? "block" : "none";
}

function removeLesson(index) {
  document.getElementById(`lesson-${index}`)?.remove();
}

function validate(el, name) {
  if (!el.value.trim()) {
    alert(name + " is required");
    el.classList.add("error");
    return false;
  }
  return true;
}

function generateJSON() {

  const sectionName = document.getElementById("sectionName");
  const sectionDuration = document.getElementById("sectionDuration");

  if (!validate(sectionName, "Section Name")) return;
  if (!validate(sectionDuration, "Section Duration")) return;

  const lessons = [];

  document.querySelectorAll(".lesson").forEach(el => {

    const typeEl = el.querySelector(".lesson-type");
    const nameEl = el.querySelector(".lesson-name");

    if (!validate(typeEl, "Type")) return;
    if (!validate(nameEl, "Name")) return;

    const lesson = {
      name: nameEl.value.trim(),
      type: typeEl.value
    };

    if (lesson.type === "VIDEO") {
      const url = el.querySelector(".lesson-video-url");
      const duration = el.querySelector(".lesson-duration");

      if (!validate(url, "Video URL")) return;
      if (!validate(duration, "Duration")) return;

      const skills = Array.from(
        el.querySelectorAll(".lesson-skill:checked")
      ).map(i => i.value);

      if (!skills.length) {
        alert("Pick at least 1 skill");
        return;
      }

      lesson.videoUrl = url.value.trim();
      lesson.duration = Number(duration.value) * 60;
      lesson.skills = skills;

      const resources = el.querySelector(".lesson-resources").value
        .split("\n").map(i => i.trim()).filter(Boolean);

      if (resources.length) lesson.resources = resources;
    }

    if (lesson.type === "QUIZ") {
      const ids = el.querySelector(".lesson-question-ids");

      if (!validate(ids, "Question IDs")) return;

      lesson.questionId = ids.value.split(",").map(i => i.trim());
    }

    lessons.push(lesson);
  });

  const result = [{
    name: sectionName.value.trim(),
    duration: Number(sectionDuration.value) * 60,
    lessons
  }];

  document.getElementById("output").textContent =
    JSON.stringify(result, null, 2);
}

addLesson();
</script>

</body>
</html>
