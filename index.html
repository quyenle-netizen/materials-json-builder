<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lesson JSON Generator</title>

  <style>
    body {
      font-family: Arial;
      padding: 24px;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 16px;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    .lesson {
      border: 1px solid #ddd;
      padding: 16px;
      margin-bottom: 16px;
      border-radius: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .full-width {
      grid-column: span 2;
    }

    label {
      font-size: 13px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 6px;
      margin-top: 4px;
    }

    .skills-wrapper {
      display: flex;
      gap: 12px;
      margin-top: 6px;
    }

    .skills-wrapper label {
      font-weight: normal;
    }

    .skills-wrapper input {
      width: auto;
      margin-right: 4px;
    }

    button {
      padding: 8px 12px;
      margin-top: 10px;
      cursor: pointer;
    }

    .danger {
      background: red;
      color: white;
    }

    pre {
      background: #111;
      color: #0f0;
      padding: 12px;
      margin-top: 20px;
      overflow-x: auto;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Course Builder</h2>

  <div class="grid">
    <div>
      <label>Section Name *</label>
      <input id="sectionName" required />
    </div>

    <div>
      <label>Section Duration (minutes) *</label>
      <input id="sectionDuration" type="number" required />
    </div>
  </div>

  <hr />

  <h3>Lessons</h3>

  <div id="lessonsContainer"></div>

  <button onclick="addLesson()">+ Add Lesson</button>
  <br /><br />
  <button onclick="generateJSON()">Generate JSON</button>

  <pre id="output"></pre>

</div>

<script>
let lessonIndex = 0;

function addLesson() {
  lessonIndex++;

  const lessonHTML = `
    <div class="lesson" id="lesson-${lessonIndex}">
      
      <div style="display:flex;justify-content:space-between;">
        <h3>Lesson ${lessonIndex}</h3>
        <button class="danger" onclick="removeLesson(${lessonIndex})">Remove</button>
      </div>

      <div class="grid">

        <div>
          <label>Type *</label>
          <select class="lesson-type" onchange="toggleLessonFields(${lessonIndex})" required>
            <option value="">Select Type</option>
            <option value="VIDEO">VIDEO</option>
            <option value="QUIZ">QUIZ</option>
          </select>
        </div>

        <div>
          <label>Lesson Name *</label>
          <input class="lesson-name" required />
        </div>

      </div>

      <!-- VIDEO -->
      <div class="video-fields" id="video-fields-${lessonIndex}" style="display:none;">
        <div class="grid">

          <div class="full-width">
            <label>Video URL *</label>
            <input class="lesson-video-url" />
          </div>

          <div class="full-width">
            <label>Thumbnail URL *</label>
            <input class="lesson-thumbnail-url" />
          </div>

          <div>
            <label>Duration (minutes) *</label>
            <input class="lesson-duration" type="number" />
          </div>

          <!-- ✅ UPDATED SKILL -->
          <div class="full-width">
            <label>Skills *</label>
            <div class="skills-wrapper">
              <label><input type="checkbox" class="lesson-skill" value="speaking"> Speaking</label>
              <label><input type="checkbox" class="lesson-skill" value="writing"> Writing</label>
              <label><input type="checkbox" class="lesson-skill" value="listening"> Listening</label>
              <label><input type="checkbox" class="lesson-skill" value="reading"> Reading</label>
            </div>
          </div>

          <div class="full-width">
            <label>Resources (optional)</label>
            <textarea class="lesson-resources"></textarea>
          </div>

        </div>
      </div>

      <!-- QUIZ -->
      <div class="quiz-fields" id="quiz-fields-${lessonIndex}" style="display:none;">
        <div class="grid">

          <div class="full-width">
            <label>Question IDs *</label>
            <input class="lesson-question-ids" />
          </div>

        </div>
      </div>

    </div>
  `;

  document.getElementById("lessonsContainer")
    .insertAdjacentHTML("beforeend", lessonHTML);
}

function toggleLessonFields(index) {
  const lesson = document.getElementById(`lesson-${index}`);
  const type = lesson.querySelector(".lesson-type").value;

  document.getElementById(`video-fields-${index}`).style.display =
    type === "VIDEO" ? "block" : "none";

  document.getElementById(`quiz-fields-${index}`).style.display =
    type === "QUIZ" ? "block" : "none";
}

function removeLesson(index) {
  document.getElementById(`lesson-${index}`)?.remove();
}

function validateField(value, name) {
  if (!value || value.trim() === "") {
    alert(name + " is required");
    return false;
  }
  return true;
}

function generateJSON() {
  const lessons = [];

  document.querySelectorAll(".lesson").forEach(lessonEl => {
    const type = lessonEl.querySelector(".lesson-type").value;
    const name = lessonEl.querySelector(".lesson-name").value;

    if (!validateField(type, "Type")) return;
    if (!validateField(name, "Name")) return;

    const lesson = { name, type };

    if (type === "VIDEO") {
      const videoUrl = lessonEl.querySelector(".lesson-video-url").value;
      const thumbnailUrl = lessonEl.querySelector(".lesson-thumbnail-url").value;
      const duration = lessonEl.querySelector(".lesson-duration").value;

      const skills = Array.from(
        lessonEl.querySelectorAll(".lesson-skill:checked")
      ).map(el => el.value);

      if (!validateField(videoUrl, "Video URL")) return;
      if (!validateField(thumbnailUrl, "Thumbnail URL")) return;
      if (!validateField(duration, "Duration")) return;

      if (!skills.length) {
        alert("Select at least 1 skill");
        return;
      }

      lesson.videoUrl = videoUrl;
      lesson.thumbnailUrl = thumbnailUrl;
      lesson.duration = Number(duration) * 60;
      lesson.skills = skills; // ✅ ARRAY

      const resources = lessonEl.querySelector(".lesson-resources").value
        .split("\n")
        .map(i => i.trim())
        .filter(Boolean);

      if (resources.length) lesson.resources = resources;
    }

    if (type === "QUIZ") {
      const ids = lessonEl.querySelector(".lesson-question-ids").value;

      if (!validateField(ids, "Question IDs")) return;

      lesson.questionId = ids.split(",").map(i => i.trim());
    }

    lessons.push(lesson);
  });

  const sectionName = document.getElementById("sectionName").value;
  const duration = document.getElementById("sectionDuration").value;

  if (!validateField(sectionName, "Section Name")) return;
  if (!validateField(duration, "Section Duration")) return;

  const result = [{
    name: sectionName,
    duration: Number(duration) * 60,
    lessons
  }];

  document.getElementById("output").textContent =
    JSON.stringify(result, null, 2);
}

addLesson();
</script>

</body>
</html>
