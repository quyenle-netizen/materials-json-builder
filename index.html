<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Course Builder</title>

<style>
body {
  font-family: system-ui;
  background: #f1f5f9;
  padding: 20px;
}

.container {
  background: white;
  padding: 20px;
  border-radius: 12px;
}

.lesson {
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
}

label {
  font-weight: 600;
  display: block;
  margin-top: 10px;
}

input, select, textarea {
  width: 100%;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #cbd5e1;
}

.skills {
  display: flex;
  gap: 10px;
  margin-top: 6px;
}

button {
  margin-top: 10px;
  margin-right: 10px;
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
}

.primary { background: #2563eb; color: white; }
.danger { background: #ef4444; color: white; }
.copy { background: #f59e0b; color: white; }
.reset { background: #6b7280; color: white; }

pre {
  margin-top: 20px;
  background: #020617;
  color: #e2e8f0;
  padding: 16px;
  border-radius: 10px;
  white-space: pre-wrap;
}

.error {
  border-color: red !important;
  background: #fef2f2;
}

.error-text {
  color: red;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<h2>Course Builder</h2>

<label>Section Name *</label>
<input id="sectionName">
<div id="err_sectionName" class="error-text"></div>

<label>Section Duration (minutes) *</label>
<input id="sectionDuration" type="number">
<div id="err_sectionDuration" class="error-text"></div>

<hr>

<h3>Lessons</h3>
<div id="lessons"></div>

<button onclick="addLesson()">+ Add Lesson</button>
<br>

<button class="primary" onclick="generate()">Generate JSON</button>
<button class="copy" onclick="copyJSON()">Copy JSON</button>
<button class="reset" onclick="resetAll()">Reset</button>

<pre id="output">// JSON here</pre>

</div>

<script>
let lessonIndex = 0;

function addLesson() {
  lessonIndex++;

  document.getElementById("lessons").innerHTML += `
  <div class="lesson" id="lesson-${lessonIndex}">
    <h3>Lesson ${lessonIndex}</h3>

    <label>Type *</label>
    <select class="type" onchange="toggle(${lessonIndex})">
      <option value="">Select</option>
      <option value="VIDEO">VIDEO</option>
      <option value="QUIZ">QUIZ</option>
    </select>

    <label>Name *</label>
    <input class="name">

    <div id="video-${lessonIndex}" style="display:none">
      <label>Video URL *</label>
      <input class="video">

      <label>Thumbnail URL *</label>
      <input class="thumb">

      <label>Duration *</label>
      <input class="duration" type="number">

      <label>Skills *</label>
      <div class="skills">
        <label><input type="checkbox" value="speaking" class="skill">Speaking</label>
        <label><input type="checkbox" value="writing" class="skill">Writing</label>
        <label><input type="checkbox" value="listening" class="skill">Listening</label>
        <label><input type="checkbox" value="reading" class="skill">Reading</label>
      </div>

      <label>Resources</label>
      <textarea class="res"></textarea>
    </div>

    <div id="quiz-${lessonIndex}" style="display:none">
      <label>Question IDs *</label>
      <input class="qids">
    </div>

    <button class="danger" onclick="removeLesson(${lessonIndex})">Remove</button>
  </div>
  `;
}

function toggle(i) {
  const lesson = document.getElementById(`lesson-${i}`);
  const type = lesson.querySelector(".type").value;

  document.getElementById(`video-${i}`).style.display =
    type === "VIDEO" ? "block" : "none";

  document.getElementById(`quiz-${i}`).style.display =
    type === "QUIZ" ? "block" : "none";
}

function removeLesson(i) {
  if (document.querySelectorAll(".lesson").length <= 1) {
    alert("At least 1 lesson required");
    return;
  }
  document.getElementById(`lesson-${i}`).remove();
}

function clearErrors() {
  document.querySelectorAll(".error").forEach(e => e.classList.remove("error"));
  document.querySelectorAll(".error-text").forEach(e => e.innerText = "");
}

function setError(el, msg) {
  el.classList.add("error");
  let err = el.nextElementSibling;
  if (!err || !err.classList.contains("error-text")) {
    err = document.createElement("div");
    err.className = "error-text";
    el.after(err);
  }
  err.innerText = msg;
}

function generate() {
  clearErrors();

  let firstError = null;
  let hasError = false;

  const sectionName = document.getElementById("sectionName");
  const duration = document.getElementById("sectionDuration");

  if (!sectionName.value.trim()) {
    setError(sectionName, "Required");
    firstError = sectionName;
    hasError = true;
  }

  if (!duration.value) {
    setError(duration, "Required");
    firstError = firstError || duration;
    hasError = true;
  }

  const lessons = [];

  document.querySelectorAll(".lesson").forEach(l => {

    const type = l.querySelector(".type");
    const name = l.querySelector(".name");

    if (!type.value) {
      setError(type, "Required");
      hasError = true;
      firstError = firstError || type;
    }

    if (!name.value.trim()) {
      setError(name, "Required");
      hasError = true;
      firstError = firstError || name;
    }

    const lesson = {
      name: name.value.trim(),
      type: type.value
    };

    if (type.value === "VIDEO") {
      const video = l.querySelector(".video");
      const thumb = l.querySelector(".thumb");
      const dur = l.querySelector(".duration");

      const skills = Array.from(l.querySelectorAll(".skill:checked"))
        .map(s => s.value);

      if (!video.value) { setError(video, "Required"); hasError = true; }
      if (!thumb.value) { setError(thumb, "Required"); hasError = true; }
      if (!dur.value) { setError(dur, "Required"); hasError = true; }
      if (!skills.length) {
        alert("Select skill");
        hasError = true;
      }

      lesson.videoUrl = video.value;
      lesson.thumbnailUrl = thumb.value;
      lesson.duration = Number(dur.value) * 60;
      lesson.skills = skills;

      const res = l.querySelector(".res").value
        .split("\n").map(i => i.trim()).filter(Boolean);

      if (res.length) lesson.resources = res;
    }

    if (type.value === "QUIZ") {
      const ids = l.querySelector(".qids");

      if (!ids.value) {
        setError(ids, "Required");
        hasError = true;
      }

      lesson.questionId = ids.value.split(",");
    }

    lessons.push(lesson);
  });

  if (hasError) {
    firstError?.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }

  const result = [{
    name: sectionName.value,
    duration: Number(duration.value) * 60,
    lessons
  }];

  document.getElementById("output").textContent =
    JSON.stringify(result, null, 2);
}

function copyJSON() {
  navigator.clipboard.writeText(
    document.getElementById("output").textContent
  );
  alert("Copied!");
}

function resetAll() {
  // clear section
  document.getElementById("sectionName").value = "";
  document.getElementById("sectionDuration").value = "";

  const lessonsContainer = document.getElementById("lessons");
  lessonsContainer.innerHTML = "";

  lessonIndex = 0;

  addLesson();

  document.getElementById("output").textContent = "// JSON here";

  clearErrors();

  window.scrollTo({ top: 0, behavior: "smooth" });
}
addLesson();
</script>

</body>
</html>
